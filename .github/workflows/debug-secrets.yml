name: Debug Secrets Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      HELLO: ${{ secrets.TEST_HELLO }}
    steps:
      - name: Print lengths
        run: |
          echo "KS length: ${#KS}"
          echo "KS first 20: ${KS:0:20}"
          echo "HELLO: ${HELLO}"
