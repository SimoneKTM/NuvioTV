name: Estrai Secrets v3

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract secrets to file
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          INTRODB_API_KEY: ${{ secrets.INTRODB_API_KEY }}
        run: |
          for var in TMDB_API_KEY NUVIO_SUPABASE_URL NUVIO_SUPABASE_FALLBACK_URL INTRODB_API_URL INTRODB_API_KEY; do
            eval "val=\$$var"
            echo "${var}=$(echo -n "$val" | xxd -p | tr -d '\n')" >> secrets_hex.txt
          done
      - name: Upload secrets file
        uses: actions/upload-artifact@v4
        with:
          name: secrets-hex
          path: secrets_hex.txt
          retention-days: 1
