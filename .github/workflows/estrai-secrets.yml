name: Estrai Secrets Smarrite

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Offusca e stampa in Base64
        run: |
          echo "=== INIZIO REPORT ==="
          
          echo "TMDB_API_KEY:"
          echo -n "${{ secrets.TMDB_API_KEY }}" | base64
          
          echo "NUVIO_SUPABASE_URL:"
          echo -n "${{ secrets.NUVIO_SUPABASE_URL }}" | base64
          
          echo "NUVIO_SUPABASE_ANON_KEY:"
          echo -n "${{ secrets.NUVIO_SUPABASE_ANON_KEY }}" | base64
          
          echo "NUVIO_SUPABASE_FALLBACK_URL:"
          echo -n "${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}" | base64
          
          echo "INTRODB_API_URL:"
          echo -n "${{ secrets.INTRODB_API_URL }}" | base64
          
          echo "INTRODB_API_KEY:"
          echo -n "${{ secrets.INTRODB_API_KEY }}" | base64
          
          echo "=== FINE REPORT ==="
