name: Estrai Secrets Smarrite

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Stampa nomi secret senza valori
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          INTRODB_API_KEY: ${{ secrets.INTRODB_API_KEY }}
        run: |
          echo "=== SECRET CONFIGURATI (valori non mostrati) ==="
          for name in TMDB_API_KEY NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY NUVIO_SUPABASE_FALLBACK_URL INTRODB_API_URL INTRODB_API_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name: presente"
            else
              echo "$name: MANCANTE"
            fi
          done
          echo "=== FINE REPORT ==="
